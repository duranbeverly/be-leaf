name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLASK_APP: app
      FLASK_ENV: production
      SCHEMA: beleaf_schema
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          pip install -r requirements.txt
          npm install --prefix react-app
      - name: Build the frontend
        run: |
          python scripts/optimize_hero.py
          test -f react-app/public/img/hero-1920.webp
          npm run build --prefix react-app
      - name: Migrate and seed
        run: |
          flask db upgrade
          flask seed all
      - name: Start the server
        run: |
          gunicorn app:app --bind 127.0.0.1:8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/plants > /dev/null && break; sleep 1; done
      - name: Smoke test
        run: |
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          curl -sf localhost:8000/api/plants | python -c "import sys,json; d=json.load(sys.stdin); n=len(d if isinstance(d,list) else next(iter(d.values()))); print(n,'plants'); sys.exit(0 if n else 1)"
      - name: Demo login works
        run: |
          curl -s -c jar -b jar localhost:8000/ > /dev/null
          curl -sf -c jar -b jar -H "Content-Type: application/json" \
            -d '{"email":"demo@aa.io","password":"password"}' localhost:8000/api/auth/login | grep -q '"email"'
      - name: Check image links (warnings only)
        run: python scripts/check_image_links.py
      - name: Probe icon kit (temporary)
        run: |
          k=$(curl -s -H "Referer: https://be-leaf.onrender.com/" https://kit.fontawesome.com/b3a790e284.js | head -c 3000 | tr -d '\n' | tr ',' ' ')
          echo "::warning title=FA kit::$(echo "$k" | grep -oE '"(license|version|method|status|domains|minify|token)":[^ ]{0,60}' | tr '\n' ' ')"
          echo "::warning title=FA kit head::$(echo "$k" | head -c 400)"
      - name: Server log
        if: always()
        run: cat server.log || true
